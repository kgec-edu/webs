<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A3161"/>
      <stop offset="100%" stop-color="#062244"/>
    </linearGradient>
  </defs>

  <!-- Background Base Ring & Plinth -->
  <g id="abacus_base" fill="url(#goldGrad)" stroke="#78350F" stroke-width="3">
    <!-- Lower Base -->
    <path d="M 80 440 L 320 440 L 340 480 L 60 480 Z" />
    <!-- Pedestal Trim -->
    <rect x="50" y="480" width="300" height="24" rx="4" />
    <rect x="70" y="504" width="260" height="16" rx="2" />
  </g>

  <!-- Central Ashoka Chakra -->
  <g id="ashoka_chakra" transform="translate(200, 460)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#0A3161" stroke-width="4"/>
    <circle cx="0" cy="0" r="4" fill="#0A3161"/>
    <!-- 24 Spokes -->
    <path d="
      M 0 0 L 0 -22 M 0 0 L 0 22 M 0 0 L -22 0 M 0 0 L 22 0
      M 0 0 L 15.5 -15.5 M 0 0 L -15.5 15.5 M 0 0 L -15.5 -15.5 M 0 0 L 15.5 15.5
      M 0 0 L 8.4 -20.3 M 0 0 L -8.4 20.3 M 0 0 L -20.3 8.4 M 0 0 L 20.3 -8.4
      M 0 0 L 20.3 8.4 M 0 0 L -20.3 -8.4 M 0 0 L 8.4 20.3 M 0 0 L -8.4 -20.3
      M 0 0 L 15.5 15.5 M 0 0 L -15.5 -15.5
    " stroke="#0A3161" stroke-width="1.8"/>
  </g>

  <!-- Galloping Horse (Left) & Bull (Right) on Abacus -->
  <g id="abacus_figures" fill="#78350F">
    <!-- Left Horse Silhouette -->
    <path d="M 100 468 C 110 455 125 455 135 462 C 145 470 150 465 155 458 C 150 472 135 478 120 475 C 105 472 100 468 100 468 Z"/>
    <!-- Right Bull Silhouette -->
    <path d="M 260 468 C 270 458 285 458 295 464 C 300 470 295 475 285 476 C 275 477 265 474 260 468 Z"/>
  </g>

  <!-- Satyameva Jayate Inscription Banner in Devanagari -->
  <g id="inscription" fill="#0A3161" font-family="'Noto Sans Devanagari', 'Sanskrit', 'Plus Jakarta Sans', serif" font-weight="800" font-size="20" text-anchor="middle">
    <text x="200" y="542" letter-spacing="4">सत्यमेव जयते</text>
  </g>

  <!-- Three Visible Lions (Forward, Left, Right) -->
  <g id="lions_capital" fill="url(#goldGrad)" stroke="#78350F" stroke-width="2.5" stroke-linejoin="round">
    
    <!-- Left Profile Lion -->
    <g id="lion_left">
      <path d="M 90 280 C 70 220 90 140 130 110 C 140 100 160 115 155 135 C 140 155 125 200 130 260 C 110 275 95 280 90 280 Z"/>
      <!-- Mane Strands -->
      <path d="M 105 160 C 85 180 95 220 120 240 M 115 135 C 100 155 105 190 130 210" stroke="#78350F" stroke-width="2" fill="none"/>
    </g>

    <!-- Right Profile Lion -->
    <g id="lion_right">
      <path d="M 310 280 C 330 220 310 140 270 110 C 260 100 240 115 245 135 C 260 155 275 200 270 260 C 290 275 305 280 310 280 Z"/>
      <!-- Mane Strands -->
      <path d="M 295 160 C 315 180 305 220 280 240 M 285 135 C 300 155 295 190 270 210" stroke="#78350F" stroke-width="2" fill="none"/>
    </g>

    <!-- Center Forward Lion (Majestic Stance) -->
    <g id="lion_center">
      <!-- Head & Crown -->
      <path d="M 150 110 C 150 60 250 60 250 110 C 270 160 265 240 240 310 L 160 310 C 135 240 130 160 150 110 Z"/>
      <!-- Face & Snout -->
      <ellipse cx="200" cy="140" rx="35" ry="40" fill="#FBBF24" stroke="#78350F" stroke-width="2"/>
      <!-- Nose & Whisker Pad -->
      <path d="M 188 150 L 212 150 L 200 165 Z" fill="#78350F"/>
      <!-- Eyes -->
      <ellipse cx="182" cy="128" rx="6" ry="4" fill="#0A3161"/>
      <ellipse cx="218" cy="128" rx="6" ry="4" fill="#0A3161"/>
      <!-- Roaring Jaws -->
      <path d="M 180 175 C 190 190 210 190 220 175 C 215 200 185 200 180 175 Z" fill="#78350F"/>
      <rect x="194" y="175" width="12" height="6" fill="#FFFFFF"/>
      
      <!-- Central Intricate Mane Layers -->
      <path d="
        M 155 180 C 135 210 145 270 170 300
        M 245 180 C 265 210 255 270 230 300
        M 165 140 C 145 160 150 200 175 220
        M 235 140 C 255 160 250 200 225 220
        M 185 220 C 175 250 185 290 200 310
        M 215 220 C 225 250 215 290 200 310
      " stroke="#78350F" stroke-width="2.5" fill="none"/>

      <!-- Muscular Forelegs and Paws -->
      <path d="M 140 310 L 140 430 L 175 430 L 175 310 Z" />
      <path d="M 225 310 L 225 430 L 260 430 L 260 310 Z" />
      <rect x="135" y="420" width="45" height="15" rx="4" fill="#F59E0B" stroke="#78350F" stroke-width="2"/>
      <rect x="220" y="420" width="45" height="15" rx="4" fill="#F59E0B" stroke="#78350F" stroke-width="2"/>
      <!-- Chest Muscle -->
      <path d="M 175 310 C 175 380 225 380 225 310 Z" fill="#F59E0B" stroke="#78350F" stroke-width="2"/>
    </g>

  </g>
</svg>
